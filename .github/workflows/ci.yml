name: CI

# Dogfood: Warden's own repo runs the same verification flow it asks
# downstream users to wire into their pipelines. The pre-flight checks
# below mirror the `/verify` slash command (lint + typecheck + tests)
# plus a final `warden scan .` against this repo so every PR proves
# the scanner stays clean on its own source tree.
#
# Runtime constraints (CLAUDE.md "Stack Constraints"):
#   - Bun >= 1.1.0 (we pin to the version used locally to keep
#     CI deterministic; bump deliberately).
#   - No `bun install` flags that fetch from anywhere other than the
#     declared registry; the workflow assumes the standard Bun cache.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fast follow-up push
# doesn't leave a stale build wasting minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint + typecheck + test + dogfood scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Tests (bun:test)
        run: bun run test

      # Dogfood: run the Warden scanner against the Warden repo
      # itself. M0-M9 all promise "warden scan . exits 0 with 0
      # high-severity findings on this tree." Anything that breaks
      # that promise breaks the build.
      - name: Dogfood scan
        run: bun packages/cli/src/index.ts scan .
